kind: pipeline
type: ssh
name: web-portfolio-v1

clone:
  disable: true

server:
  host:
    from_secret: vps_ip
  user:
    from_secret: username
  # Drone's ssh pipeline has no separate port field — include the port in
  # the host secret itself, e.g. vps_ip = "1.2.3.4:2230".
  ssh_key:
   from_secret: ssh_private_key

environment:
  PROJECT_PATH:
   from_secret: project_dir

steps:
  - name: Checkout
    commands:
      - echo "=== Checkout branch ==="
      - cd $PROJECT_PATH
      - git checkout master
  - name: Pulling
    commands:
      - echo "=== Pulling latest code ==="
      - git pull origin master
  - name: Stop service
    commands:
      - echo "=== Stop and remove the running service ==="
      - docker compose down
  - name: Build
    commands:
      - echo "=== Building Application ==="
      - docker compose build --no-cache
  - name: Deploy
    commands:
      - echo "=== Starting the service ==="
      - docker compose up -d
  - name: Cleanup
    commands:
      - echo "=== Cleanup the service ==="
      - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master