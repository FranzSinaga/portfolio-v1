kind: pipeline
type: ssh
name: web-portfolio-v1

clone:
  disable: true

server:
  host:
    from_secret: vps_ip
  user:
    from_secret: username
  # Drone's ssh pipeline has no separate port field — include the port in
  # the host secret itself, e.g. vps_ip = "1.2.3.4:2230".
  ssh_key:
   from_secret: ssh_private_key

# Sets the cwd for every step below, so PROJECT_PATH doesn't need to be
# repeated per-step. UNVERIFIED: if Drone rejects from_secret here (this
# field may only accept a literal string), replace with a plain path, e.g.
# workspace: { path: /home/user/apps/portfolio-v1 }.
workspace:
  path:
    from_secret: project_dir

steps:
  - name: Checkout
    commands:
      - echo "=== Checkout branch ==="
      - git checkout master
  - name: Pulling
    commands:
      - echo "=== Pulling latest code ==="
      - git pull origin master
  - name: Stop service
    commands:
      - echo "=== Stop and remove the running service ==="
      - docker compose down
  - name: Build
    commands:
      - echo "=== Building Application ==="
      - docker compose build --no-cache
  - name: Deploy
    commands:
      - echo "=== Starting the service ==="
      - docker compose up -d
  - name: Cleanup
    commands:
      - echo "=== Cleanup the service ==="
      - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master