kind: pipeline
type: ssh
name: web-portfolio-v1

clone:
  disable: true

server:
  host:
    from_secret: vps_ip
  user:
    from_secret: username
  # Drone's ssh pipeline has no separate port field — include the port in
  # the host secret itself, e.g. vps_ip = "1.2.3.4:2230".
  ssh_key:
   from_secret: ssh_private_key

# workspace.path only accepts a literal string (no from_secret), and a
# literal path would expose the VPS username in the repo, so PROJECT_PATH
# stays a per-step secret instead of a global workspace path.
steps:
  - name: Checkout & Pull
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Checkout branch and pull latest code ==="
      - cd $PROJECT_PATH
      - git checkout master
      - git pull origin master
  - name: Verify
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Typecheck and lint ==="
      - cd $PROJECT_PATH
      - docker run --rm -v "$PWD":/app -w /app node:20-alpine sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm run lint"
  - name: Build
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Building Application ==="
      - cd $PROJECT_PATH
      - docker compose build --no-cache
  - name: Deploy
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Stop old service and start the new one ==="
      - cd $PROJECT_PATH
      - docker compose down
      - docker compose up -d
  - name: Cleanup
    commands:
      - echo "=== Cleanup the service ==="
      - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master