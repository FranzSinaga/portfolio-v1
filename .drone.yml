kind: pipeline
type: ssh
name: web-portfolio-v1

clone:
  disable: true

server:
  host:
    from_secret: vps_ip
  user:
    from_secret: username
  # Drone's ssh pipeline has no separate port field — include the port in
  # the host secret itself, e.g. vps_ip = "1.2.3.4:2230".
  ssh_key:
   from_secret: ssh_private_key

# workspace.path only accepts a literal string (no from_secret), and a
# literal path would expose the VPS username in the repo, so PROJECT_PATH
# stays a per-step secret instead of a global workspace path.
steps:
  - name: Checkout
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Checkout branch ==="
      - cd $PROJECT_PATH
      - git checkout master
  - name: Pulling
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Pulling latest code ==="
      - cd $PROJECT_PATH
      - git pull origin master
  - name: Stop service
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Stop and remove the running service ==="
      - cd $PROJECT_PATH
      - docker compose down
  - name: Build
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Building Application ==="
      - cd $PROJECT_PATH
      - docker compose build --no-cache
  - name: Deploy
    environment:
      PROJECT_PATH:
        from_secret: project_dir
    commands:
      - echo "=== Starting the service ==="
      - cd $PROJECT_PATH
      - docker compose up -d
  - name: Cleanup
    commands:
      - echo "=== Cleanup the service ==="
      - docker system prune -f

trigger:
  event:
    - push
  branch:
    - master